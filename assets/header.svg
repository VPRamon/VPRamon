<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-label="VPRAMON animated terminal header">
  <style>
    :root { color-scheme: light dark; }
    .panel { fill: #0d1117; stroke: #30363d; }
    .muted { fill: #7d8590; }
    .text { fill: #e6edf3; }
    .accent { fill: #58a6ff; }
    .accent-stroke { stroke: #58a6ff; }
    .warm { fill: #f78166; }
    .logo { fill: #e6edf3; font: 700 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .cursor { animation: blink 1.05s steps(1,end) infinite; }
    .glitch-a { fill: #58a6ff; opacity: 0; animation: glitch-a 8s infinite; }
    .glitch-b { fill: #f78166; opacity: 0; animation: glitch-b 8s infinite; }
    .orbit { fill: none; stroke-width: 1; stroke-dasharray: 5 11; opacity: .28; animation: dash 22s linear infinite; }
    .scan { fill: url(#scan-gradient); opacity: .16; animation: scan 7s linear infinite; }
    @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    @keyframes dash { to { stroke-dashoffset: -320; } }
    @keyframes scan { from { transform: translateY(-80px); } to { transform: translateY(390px); } }
    @keyframes glitch-a {
      0%, 91%, 94%, 100% { opacity: 0; transform: translate(0,0); }
      92% { opacity: .75; transform: translate(4px,-1px); }
      93% { opacity: .35; transform: translate(-2px,1px); }
    }
    @keyframes glitch-b {
      0%, 91.5%, 94.5%, 100% { opacity: 0; transform: translate(0,0); }
      92.5% { opacity: .65; transform: translate(-4px,1px); }
      93.5% { opacity: .25; transform: translate(2px,-1px); }
    }
    @media (prefers-color-scheme: light) {
      .panel { fill: #ffffff; stroke: #d0d7de; }
      .muted { fill: #57606a; }
      .text, .logo { fill: #24292f; }
      .accent { fill: #0969da; }
      .accent-stroke { stroke: #0969da; }
      .warm { fill: #cf222e; }
      .glitch-a { fill: #0969da; }
      .glitch-b { fill: #cf222e; }
    }
  </style>

  <defs>
    <linearGradient id="scan-gradient" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="panel-clip"><rect x="12" y="12" width="976" height="286" rx="14"/></clipPath>
    <g id="ascii-logo" class="logo mono">
      <text x="500" y="103" text-anchor="middle" xml:space="preserve">██╗   ██╗██████╗ ██████╗  █████╗ ███╗   ███╗ ██████╗ ███╗   ██╗</text>
      <text x="500" y="121" text-anchor="middle" xml:space="preserve">██║   ██║██╔══██╗██╔══██╗██╔══██╗████╗ ████║██╔═══██╗████╗  ██║</text>
      <text x="500" y="139" text-anchor="middle" xml:space="preserve">██║   ██║██████╔╝██████╔╝███████║██╔████╔██║██║   ██║██╔██╗ ██║</text>
      <text x="500" y="157" text-anchor="middle" xml:space="preserve">╚██╗ ██╔╝██╔═══╝ ██╔══██╗██╔══██║██║╚██╔╝██║██║   ██║██║╚██╗██║</text>
      <text x="500" y="175" text-anchor="middle" xml:space="preserve"> ╚████╔╝ ██║     ██║  ██║██║  ██║██║ ╚═╝ ██║╚██████╔╝██║ ╚████║</text>
      <text x="500" y="193" text-anchor="middle" xml:space="preserve">  ╚═══╝  ╚═╝     ╚═╝  ╚═╝╚═╝  ╚═╝╚═╝     ╚═╝ ╚═════╝ ╚═╝  ╚═══╝</text>
    </g>
  </defs>

  <rect x="12" y="12" width="976" height="286" rx="14" class="panel"/>

  <g clip-path="url(#panel-clip)">
    <path d="M70 215 C230 25 760 15 930 206 C770 276 250 289 70 215Z" class="orbit accent-stroke"/>
    <path d="M95 72 C305 258 682 273 905 82" class="orbit accent-stroke" style="animation-direction:reverse;opacity:.15"/>

    <g opacity=".34" class="accent">
      <circle cx="108" cy="91" r="1.5"/><circle cx="189" cy="242" r="1"/><circle cx="310" cy="55" r="1"/>
      <circle cx="694" cy="53" r="1.4"/><circle cx="839" cy="228" r="1"/><circle cx="923" cy="118" r="1.3"/>
    </g>

    <circle r="3" class="warm">
      <animateMotion dur="12s" repeatCount="indefinite" path="M70 215 C230 25 760 15 930 206 C770 276 250 289 70 215Z"/>
    </circle>

    <rect x="12" y="-74" width="976" height="70" class="scan"/>
  </g>

  <circle cx="36" cy="34" r="4" fill="#f85149" opacity=".8"/>
  <circle cx="51" cy="34" r="4" fill="#d29922" opacity=".8"/>
  <circle cx="66" cy="34" r="4" fill="#3fb950" opacity=".8"/>

  <text x="88" y="39" class="mono muted" font-size="12">ramon@github:~$ ./profile --boot</text>
  <text x="949" y="39" text-anchor="end" class="mono muted" font-size="11">PID 74069811 · RUNNING</text>

  <use href="#ascii-logo" class="glitch-a"/>
  <use href="#ascii-logo" class="glitch-b"/>
  <use href="#ascii-logo"/>

  <text x="500" y="231" text-anchor="middle" class="mono text" font-size="15" letter-spacing="1.7">software / science / security / curiosity</text>
  <text x="500" y="262" text-anchor="middle" class="mono muted" font-size="12">building things · breaking assumptions · learning continuously</text>

  <text x="38" y="282" class="mono accent" font-size="12">&gt; ready</text>
  <rect x="94" y="273" width="7" height="12" rx="1" class="accent cursor"/>
</svg>
